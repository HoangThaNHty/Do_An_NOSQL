{% extends "base.html" %}
{% block title %}Dang nhap - {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white fw-bold"><i class="bi bi-box-arrow-in-right"></i> Dang nhap</div>
            <div class="card-body">
                <form method="post" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label class="form-label">Email hoac ten dang nhap</label>
                        <input type="text" name="identifier" class="form-control" value="{{ identifier }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mat khau</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Dang nhap</button>
                </form>
                <hr>
                <p class="text-center mb-0">
                    Chua co tai khoan? <a href="{{ url_for('auth.register') }}">Dang ky ngay</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
